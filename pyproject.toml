[project]
name = "media-manager"
version = "0.3.0"
description = "Photos & videos, music, movies & TV: review, tag, rename, move and play your media (Windows)."
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "Pillow>=11.2", "pillow-heif>=0.18", "mutagen>=1.47", "send2trash>=1.8"]

[project.gui-scripts]
media-manager = "media_manager.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
extend-exclude = ["photo_manager", "tests/photo"]  # copied from Photo Manager as it is

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
