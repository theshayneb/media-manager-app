name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml", "photo_manager/core/metadata.py"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Tests (tags, rename patterns, edit maths)
        run: gradle -p android :core:test --console=plain

      - name: The PC reads what the phone writes (real ExifTool + Photo Manager's reader)
        run: |
          sudo apt-get install -y libimage-exiftool-perl > /dev/null
          python3 - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from photo_manager.core.exiftool import ExifTool, find_exiftool
          from photo_manager.core.metadata import READ_TAGS, parse_meta
          with ExifTool(find_exiftool()) as et:
              [data] = et.read(["android/core/build/interop.jpg"], READ_TAGS)
          m = parse_meta(data)
          print(m.keywords, m.label, m.starred, m.bookmarked, m.edited)
          assert m.keywords == ["josh", "new york", "café"]
          assert m.label == "Green" and m.starred and m.bookmarked and m.edited
          PY

      - name: Signing key (the same every time, from the repository's secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/companion.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/companion.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signed with a temporary key (a new version won't install over this one)"
          fi

      - name: Build the app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ONEDRIVE_CLIENT_ID: ${{ vars.ONEDRIVE_CLIENT_ID }}
        run: |
          gradle -p android :app:assembleRelease --console=plain
          cp android/app/build/outputs/apk/release/app-release.apk MediaManager-companion.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MediaManager-companion
          path: MediaManager-companion.apk

      - name: Release (android-<version> from android/version.txt, once)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="android-$(cat android/version.txt)"
          if gh release view "$v" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $v already exists"
          else
            gh release create "$v" MediaManager-companion.apk --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" --title "Media Manager companion (Android) ${v#android-}" \
              --notes "Install MediaManager-companion.apk on your Android phone or tablet (Android 11 or newer)." \
              --latest=false
          fi
